identifier = "com.example.auto-support-plane"
app_version = "0.1.1"
entrypoint = ["/entrypoint.sh", "python3", "-u", "/app/main.py"]
base_image = "luxonis/oakapp-base:1.3.0-py311"
assign_frontend_port = true
storage_dir_name = "storage"
stop_grace_period = "10s"

prepare_container = [
  { type = "RUN", command = "apt-get update && apt-get install -y --no-install-recommends libgfortran5 libgomp1 libegl1 libgl1 && rm -rf /var/lib/apt/lists/*" },
  { type = "COPY", source = "requirements.txt", target = "requirements.txt" },
  { type = "RUN", command = "python3 -m pip install -r /app/requirements.txt --break-system-packages" },
  { type = "RUN", command = "python3 -c 'import pathlib, sysconfig, subprocess; root=pathlib.Path(sysconfig.get_paths()[\"purelib\"])/\"open3d\"; missing=[line for p in root.rglob(\"*.so\") for line in subprocess.check_output([\"ldd\", str(p)], text=True).splitlines() if \"not found\" in line]; print(\"Missing shared libraries:\", missing); assert not missing; import depthai, open3d; print(\"Native dependencies ready:\", depthai.__version__, open3d.__version__)'" },
]

[static_frontend]
dist_path = "./frontend"

[env]
PYTHONUNBUFFERED = "1"
