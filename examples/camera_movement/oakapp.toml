identifier = "com.example.camera-movement"
app_version = "0.1.0"
entrypoint = ["/entrypoint.sh", "python3", "-u", "/app/main.py"]
base_image = "luxonis/oakapp-base:1.3.0"
assign_frontend_port = true

build_steps = [
    "python3 -m pip install --break-system-packages 'depthai==3.12.0' /app/library",
]

[env]
DEPTHAI_TELEMETRY = "0"
