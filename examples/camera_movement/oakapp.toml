identifier = "com.example.camera-movement"
app_version = "0.1.0"
entrypoint = ["/entrypoint.sh", "python3", "-u", "/app/main.py"]
base_image = "luxonis/oakapp-base:1.5.0"
assign_frontend_port = true

build_steps = [
    """
    if [ -f /app/library/pyproject.toml ]; then
        library=/app/library
    else
        library=https://github.com/luxonis/depthai-nodes/archive/7dddc498debdca15ece2afa451a6dc74b2733e4b.tar.gz
    fi
    python3 -m pip install --break-system-packages 'depthai==3.12.0' "$library"
    """,
]

[static_frontend]
dist_path = "./frontend"

[env]
DEPTHAI_TELEMETRY = "0"
