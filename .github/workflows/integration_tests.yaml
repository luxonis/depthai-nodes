name: Integration tests for parsers and host nodes.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'depthai_nodes/**'
      - 'tests/**'
      - pyproject.toml
      - requirements.txt
      - requirements-dev.txt
      - requirements-measure-anything.txt
      - .gitattributes
      - .github/workflows/stability_tests.yaml
      - .github/workflows/integration_tests.yaml

jobs:
  Integration-tests:
    env:
      DEPTHAI_TELEMETRY: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.10', '3.14']

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install package
      run: pip install -e ".[dev]"

    - name: Install frozen measurement dependencies
      if: matrix.python-version != '3.14'
      run: pip install -e ".[measure-anything]"

    - name: Run integration tests
      env:
        PYTEST_ADDOPTS: ${{ matrix.python-version == '3.14' && format('--ignore={0}/tests/measure_anything_reference --ignore={0}/tests/unittests/test_measure_anything_algorithm --ignore={0}/tests/unittests/test_measure_anything_nodes', github.workspace) || '' }}
      run: |
        cd tests/stability_tests
        export B2_APPLICATION_KEY=${{ secrets.B2_APPLICATION_KEY }}
        export B2_APPLICATION_KEY_ID=${{ secrets.B2_APPLICATION_KEY_ID }}
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          python main.py ${{ github.event.inputs.additional-parameter }} --duration ${{ github.event.inputs.duration }}
        else
          python main.py -all --download --duration 2
        fi
