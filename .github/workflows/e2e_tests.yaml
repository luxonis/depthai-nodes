name: End-to-End Depthai-nodes tests

on:
  workflow_dispatch:
    inputs:
      distinct_id:
        description: 'run identifier'
        required: false
      reservation_name:
          description: 'Reservation name - usually usually unique identifier of root CI run'
          required: false
          type: string
      bom_mode:
        description: 'Check if tests are part of BOM testing'
        required: false
        type: boolean
      additional-parameter:
        description: 'Additional parameter: -all or -p <parser_name>. Default: -all. If -p is used: -p <parser_name>'
        required: true
        default: '-all'
      depthai-nodes-version:
        description: 'Release or branch of depthai nodes we are testing against'
        required: true
        default: 'main'
      depthai-version:
        description: 'Version of depthai to install. Default: 3.12.0'
        required: true
        default: '3.12.0'
      platform:
        description: 'Platform to use for testing. By default both RVC2 and RVC4 are used but you can use only one by passing only `rvc2` or `rvc4`(use lowercase).'
        default: "all"
        required: false
      select-os:
        description: 'Select which os to tests when dispatching'
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-only
          - windows-only
          - mac-only
      protocol:
        description: 'Protocol to use for testing. TCP is used.'
        type: choice
        options:
          - tcpip
          - usb
        default: tcpip
        required: false
      additional_options:
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'depthai_nodes/**'
      - 'tests/end_to_end/**'
      - .github/workflows/e2e_tests.yaml

permissions:
  contents: read
  packages: read

jobs:
  id:
    name: Workflow ID Provider
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }}
        run: echo ${{ github.event.inputs.distinct_id }}
  HIL-test:
    runs-on: ['self-hosted', 'testbed-runner']
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.select-os == 'all' || github.event.inputs.select-os == 'linux-only'))
    strategy:
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (github.event.inputs.platform == 'all' && '["rvc2", "rvc4", "rvc4-usb"]' || format('["{0}"]', github.event.inputs.platform)) || '["rvc2", "rvc4", "rvc4-usb"]') }}

    steps:
      - uses: actions/checkout@v3

      - name: Run Test
        env:
          SAFE_REF_NAME: ${{ github.ref_name }}
          SAFE_MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          JOB=${{ job.check_run_id }}
          export RESERVATION_NAME="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${JOB}"
          python3 -m venv venv
          . venv/bin/activate
          pip install hil_framework --upgrade --index-url https://__token__:${{ secrets.GITLAB_TOKEN }}@gitlab.luxonis.com/api/v4/projects/213/packages/pypi/simple --no-cache-dir
          PLATFORM="$SAFE_MATRIX_PLATFORM"
          if [ "$PLATFORM" = "rvc4-usb" ]; then
            PLATFORM="rvc4"
          fi
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then

            if [[ -n "${{ github.event.inputs.reservation_name }}" ]]; then
              RESERVATION_OPTION="--reservation-name ${{ github.event.inputs.reservation_name }}"
            else
              RESERVATION_OPTION="--reservation-name $RESERVATION_NAME"
            fi

            if [[ -n "${{ github.event.inputs.additional_options }}" ]]; then
              ADDITIONAL_OPTIONS="${{ github.event.inputs.additional_options }}"
            fi

            if [[ "${{ github.event.inputs.bom_mode }}" == 'true' ]]; then
              exec hil_runner --hold-reservation $ADDITIONAL_OPTIONS --models 'oak4_s or oak4_pro or oak4_d' --wait $RESERVATION_OPTION --dockerfile ./tests/end_to_end/Dockerfile --docker-run-args "--env DEPTHAI_PROTOCOL=${{ github.event.inputs.protocol }} --env DEPTHAI_TELEMETRY=0 --env LUXONIS_EXTRA_INDEX_URL=${{secrets.LUXONIS_EXTRA_INDEX_URL}} --env DEPTHAI_VERSION=${{ github.event.inputs.depthai-version }} --env HUBAI_TEAM_SLUG=${{ secrets.HUBAI_TEAM_SLUG }} --env HUBAI_API_KEY=${{ secrets.HUBAI_API_KEY }} --env BRANCH=${{ github.event.inputs.depthai-nodes-version }} --env FLAGS=\"${{ github.event.inputs.additional-parameter }} -v ${{ github.event.inputs.depthai-nodes-version }} --platform ${{ matrix.platform }}\""
            else
              exec hil_runner --platforms $PLATFORM --wait $RESERVATION_OPTION --before-docker-pull "echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin" --docker-image ghcr.io/luxonis/depthai-nodes-testing --docker-run-args "--env DEPTHAI_TELEMETRY=0 --env LUXONIS_EXTRA_INDEX_URL=${{secrets.LUXONIS_EXTRA_INDEX_URL}} --env DEPTHAI_VERSION=${{ github.event.inputs.depthai-version }} --env HUBAI_TEAM_SLUG=${{ secrets.HUBAI_TEAM_SLUG }} --env HUBAI_API_KEY=${{ secrets.HUBAI_API_KEY }} --env BRANCH=${{ github.event.inputs.depthai-nodes-version }} --env FLAGS=\"${{ github.event.inputs.additional-parameter }} -v ${{ github.event.inputs.depthai-nodes-version }} --platform ${{ matrix.platform }}\""
            fi
          else
            exec hil_runner --platforms $PLATFORM --wait --reservation-name $RESERVATION_NAME --before-docker-pull "echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin" --docker-image ghcr.io/luxonis/depthai-nodes-testing --docker-run-args "--env DEPTHAI_TELEMETRY=0 --env LUXONIS_EXTRA_INDEX_URL=${{secrets.LUXONIS_EXTRA_INDEX_URL}} --env DEPTHAI_VERSION=\"3.12.0\" --env HUBAI_TEAM_SLUG=${{ secrets.HUBAI_TEAM_SLUG }} --env HUBAI_API_KEY=${{ secrets.HUBAI_API_KEY }} --env BRANCH=\"$SAFE_REF_NAME\" --env FLAGS=\"-all --platform $SAFE_MATRIX_PLATFORM\""
          fi
  
  HIL-test-windows:
    runs-on: ['self-hosted', 'testbed-runner']
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.select-os == 'all' || github.event.inputs.select-os == 'windows-only'))
    steps:
      - uses: actions/checkout@v3

      - name: Run Test
        env:
          SAFE_REF_NAME: ${{ github.ref_name }}
        run: |
          JOB=${{ job.check_run_id }}
          export RESERVATION_NAME="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${JOB}"
          python3 -m venv venv
          . venv/bin/activate
          pip install hil_framework --upgrade --index-url https://__token__:${{ secrets.GITLAB_TOKEN }}@gitlab.luxonis.com/api/v4/projects/213/packages/pypi/simple --no-cache-dir
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [[ -n "${{ github.event.inputs.reservation_name }}" ]]; then
                RESERVATION_OPTION="--reservation-name ${{ github.event.inputs.reservation_name }}"
            else
                RESERVATION_OPTION="--reservation-name $RESERVATION_NAME"
            fi

            if [[ -n "${{ github.event.inputs.additional_options }}" ]]; then
                ADDITIONAL_OPTIONS="${{ github.event.inputs.additional_options }}"
            fi
            if [[ "${{ github.event.inputs.bom_mode }}" == 'true' ]]; then
              exec hil_runner --hold-reservation $ADDITIONAL_OPTIONS -os windows --no-shell --models 'oak4_s or oak4_pro or oak4_d' --wait $RESERVATION_OPTION --commands "rmdir /S /Q depthai-nodes & git clone https://github.com/luxonis/depthai-nodes.git && cd depthai-nodes\tests\end_to_end && set \"DEPTHAI_TELEMETRY=0\" && windows_end_to_end.cmd ${{ github.event.inputs.depthai-nodes-version }} ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} ${{ github.event.inputs.depthai-version }} ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
            else
              exec hil_runner --models 'oak4_s or oak4_pro or oak4_d' --wait $RESERVATION_OPTION -os windows --no-shell --commands "rmdir /S /Q depthai-nodes & git clone https://github.com/luxonis/depthai-nodes.git && cd depthai-nodes\tests\end_to_end && set \"DEPTHAI_TELEMETRY=0\" && windows_end_to_end.cmd ${{ github.event.inputs.depthai-nodes-version }} ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} ${{ github.event.inputs.depthai-version }} ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
            fi
          else
            exec hil_runner --models 'oak4_s or oak4_pro or oak4_d' --wait --reservation-name $RESERVATION_NAME -os windows --no-shell --commands "rmdir /S /Q depthai-nodes & git clone https://github.com/luxonis/depthai-nodes.git && cd depthai-nodes\tests\end_to_end && set \"DEPTHAI_TELEMETRY=0\" && windows_end_to_end.cmd \"$SAFE_REF_NAME\" ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} 3.12.0 ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
          fi

  HIL-test-mac:
    runs-on: ['self-hosted', 'testbed-runner']
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.select-os == 'all' || github.event.inputs.select-os == 'mac-only'))
    steps:
      # Backwards compatibility for bom
      - uses: actions/checkout@v4
        with:
          ref: "main"
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          ref: "${{ inputs.depthai-nodes-version || github.ref_name }}"
          fetch-depth: 0
          path: depthai-nodes

      - name: Run Test
        run: |
          cp -n tests/end_to_end/run_end_to_end_mac.sh depthai-nodes/tests/end_to_end/run_end_to_end_mac.sh
          cd depthai-nodes
          python3 -m venv venv
          . venv/bin/activate
          pip install hil_framework --upgrade --index-url https://__token__:${{ secrets.GITLAB_TOKEN }}@gitlab.luxonis.com/api/v4/projects/213/packages/pypi/simple --no-cache-dir
          JOB=${{ job.check_run_id }}
          export RESERVATION_NAME="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${JOB}"
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [[ -n "${{ github.event.inputs.reservation_name }}" ]]; then
                RESERVATION_OPTION="--reservation-name ${{ github.event.inputs.reservation_name }}"
            else
                RESERVATION_OPTION="--reservation-name $RESERVATION_NAME"
            fi

            if [[ -n "${{ github.event.inputs.additional_options }}" ]]; then
                ADDITIONAL_OPTIONS="${{ github.event.inputs.additional_options }}"
            fi
            if [[ "${{ github.event.inputs.bom_mode }}" == 'true' ]]; then
              exec hil_runner --hold-reservation $ADDITIONAL_OPTIONS -os mac --basic-sanity --models 'oak4_s or oak4_pro or oak4_d' --wait $RESERVATION_OPTION --sync-workspace --commands "cd /tmp/depthai-nodes && DEPTHAI_TELEMETRY=0 ./tests/end_to_end/run_end_to_end_mac.sh ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} ${{ github.event.inputs.depthai-version }} ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
            else
              exec hil_runner --models 'oak4_s or oak4_pro or oak4_d' --wait $RESERVATION_OPTION -os mac --basic-sanity --sync-workspace --commands "cd /tmp/depthai-nodes && DEPTHAI_TELEMETRY=0 ./tests/end_to_end/run_end_to_end_mac.sh ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} ${{ github.event.inputs.depthai-version }} ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
            fi
          else
            exec hil_runner --models 'oak4_s or oak4_pro or oak4_d' --wait --basic-sanity --reservation-name $RESERVATION_NAME -os mac --sync-workspace --commands "cd /tmp/depthai-nodes && DEPTHAI_TELEMETRY=0 ./tests/end_to_end/run_end_to_end_mac.sh ${{ secrets.HUBAI_API_KEY }} ${{ secrets.HUBAI_TEAM_SLUG }} 3.12.0 ${{secrets.LUXONIS_EXTRA_INDEX_URL}} rvc4"
          fi

  notify-bom-failure:
    name: Notify #ml-devs-gh of BOM failure
    needs: [HIL-test, HIL-test-windows, HIL-test-mac]
    if: >
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.bom_mode == 'true' &&
      startsWith(github.event.inputs.reservation_name, 'https://github.com/luxonis/luxonis-bom/actions/runs/') &&
      (needs.HIL-test.result == 'failure' ||
       needs.HIL-test-windows.result == 'failure' ||
       needs.HIL-test-mac.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Post to #ml-devs-gh
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: C06D4HWU7SQ
          LINUX_RESULT: ${{ needs.HIL-test.result }}
          WINDOWS_RESULT: ${{ needs.HIL-test-windows.result }}
          MAC_RESULT: ${{ needs.HIL-test-mac.result }}
        run: |
          : "${SLACK_BOT_TOKEN:?Set the SLACK_BOT_TOKEN Actions secret to send BOM alerts}"
          failed=()
          [[ "$LINUX_RESULT" == failure ]] && failed+=(Linux)
          [[ "$WINDOWS_RESULT" == failure ]] && failed+=(Windows)
          [[ "$MAC_RESULT" == failure ]] && failed+=(macOS)
          failed_platforms=$(IFS=', '; echo "${failed[*]}")
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          message=$(printf '<@U03PLCLEFU2> :rotating_light: *DepthAI Nodes BOM tests failed*\nFailed platforms: %s\nTest run: %s' \
            "$failed_platforms" "$run_url")
          payload=$(jq -n --arg channel "$SLACK_CHANNEL_ID" --arg text "$message" \
            '{channel: $channel, text: $text}')
          response=$(curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "$payload" https://slack.com/api/chat.postMessage)
          jq -e '.ok == true' >/dev/null <<< "$response" || {
            echo 'Slack rejected the BOM failure notification' >&2
            exit 1
          }
